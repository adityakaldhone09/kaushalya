<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>KAUSHALYA Notification</title>
</head>
<body>
    <h2>Hello {{ name }},</h2>
    <p>You have a new notification regarding: <strong>{{ notification_type }}</strong></p>
    <ul>
        {% for key, value in details.items() %}
            <li><strong>{{ key }}:</strong> {{ value }}</li>
        {% endfor %}
    </ul>
    <p>Log in to your account to see more details: <a href="{{ frontend_url }}">{{ frontend_url }}</a></p>
    <br>
    <p>Best regards,<br>The KAUSHALYA Team</p>
</body>
</html>
